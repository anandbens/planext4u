<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketHub - Products, Services & Classifieds</title>
    <meta name="description" content="Your one-stop marketplace for products, services, and classified ads. Shop from verified vendors, book home services, and post free classifieds." />
    <meta name="author" content="MarketHub" />
    <link rel="canonical" href="https://markethub.com" />

    <meta property="og:title" content="MarketHub - Products, Services & Classifieds" />
    <meta property="og:description" content="Your one-stop marketplace for products, services, and classified ads." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MarketHub" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MarketHub",
      "url": "https://markethub.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://markethub.com/app/browse?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "MarketHub",
      "url": "https://markethub.com",
      "description": "Multi-vendor marketplace for products, services, and classified ads"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
